<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="A personal map of the countries and regions we've visited." />
    <meta id="theme-color-light" name="theme-color" media="(prefers-color-scheme: light)" content="#f2f2f7" />
    <meta id="theme-color-dark" name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Visited Countries</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌍</text></svg>"
    />

    <script>
      // Apply a remembered theme before the first paint, so switching does not
      // flash the other one. With no stored choice nothing is set here and the
      // stylesheet keeps following the OS.
      try {
        const saved = localStorage.getItem('visited-countries:theme');
        if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
      } catch (err) {
        /* private mode: fall back to the OS setting */
      }
    </script>

    <link rel="preconnect" href="https://a.basemaps.cartocdn.com" crossorigin />
    <link rel="stylesheet" href="./assets/leaflet/leaflet.css" />
    <link rel="stylesheet" href="./styles/main.css" />
  </head>
  <body>
    <header class="app-header">
      <div class="app-heading">
        <h1 id="app-title">Visited Countries</h1>
        <p id="app-subtitle">Everywhere we've been</p>
      </div>

      <div class="search">
        <label class="sr-only" for="search-input">Search for a country or region</label>
        <input
          id="search-input"
          class="search-input"
          type="search"
          placeholder="Search 1,000+ countries, regions and islands…"
          autocomplete="off"
          autocorrect="off"
          spellcheck="false"
          role="combobox"
          aria-expanded="false"
          aria-controls="search-results"
          aria-autocomplete="list"
        />
        <div id="search-results" class="search-results" role="listbox" hidden></div>
      </div>

      <button id="theme-toggle" class="theme-toggle" type="button" title="Switch theme">
        <span class="sr-only">Switch between light and dark</span>
        <!-- Shown while the page is light: pressing it goes dark. -->
        <svg class="to-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z" />
        </svg>
        <!-- Shown while the page is dark. -->
        <svg class="to-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4" />
        </svg>
      </button>
    </header>

    <main class="layout">
      <section class="map-card">
        <div id="map" class="map"></div>
        <p class="map-hint">
          Striped regions were visited by more than one person — tap anywhere for details and its
          code.
        </p>
      </section>

      <div class="panel">
        <div id="stats" class="stats"></div>

        <section class="card">
          <h2 class="card-title">Travellers</h2>
          <div id="people" class="people"></div>
        </section>

        <section id="continents" class="card">
          <div class="list-head">
            <h2 class="card-title">By continent</h2>
            <span class="list-count">0%</span>
          </div>
          <div class="list-body"></div>
        </section>

        <section id="everyone" class="card">
          <div class="list-head">
            <h2 class="card-title">Visited by all</h2>
            <span class="list-count">0</span>
          </div>
          <div class="list-body"></div>
        </section>

        <section id="notall" class="card">
          <div class="list-head">
            <h2 class="card-title">Visited by some</h2>
            <span class="list-count">0</span>
          </div>
          <div class="list-body"></div>
        </section>
      </div>
    </main>

    <footer class="app-footer">
      <p>
        Edit <code>data/people.js</code> to change who has been where — every code is in
        <code>REGIONS.md</code>.
      </p>
    </footer>

    <div id="error" class="error" hidden></div>

    <!-- Leaflet is vendored locally — no external/CDN dependency. Loads before the app. -->
    <script src="./assets/leaflet/leaflet.js"></script>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
